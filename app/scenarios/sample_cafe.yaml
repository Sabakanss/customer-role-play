id: sample_cafe
industry: 飲食店（カフェ）
customer_role: 店長
opening_line: >-
  最近、平日のお昼どきにレジが混み合って、お客様をお待たせすることが増えています。

# 質問された場合のみ回答する情報
hidden_facts:
  - 12時から13時に来店が集中する
  - レジが1台しかない
  - 新人スタッフはまだレジ操作に慣れていない
  - 人員を増やす予算はない
  - 大きな改装は今年は難しい
  - 店内のレイアウト変更は可能

# 改善提案が満たすべき制約
constraints:
  - 人員を増やす予算はない
  - 大きな改装は今年は難しい

# レビュー時の評価観点
review_criteria:
  - 現場として納得できるか
  - 実現可能か
  - 制約を満たしているか
